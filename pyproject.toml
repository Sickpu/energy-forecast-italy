[project]
name = "energy-forecast"
version = "0.1.0"
description = "Previsione day-ahead di carico e prezzo elettrico in Italia (ENTSO-E)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "entsoe-py>=0.6",
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "python-dotenv>=1.0",
    "pyarrow>=16",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.1"]
app = ["streamlit>=1.40", "shap>=0.46", "plotly>=5.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_forecast"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
